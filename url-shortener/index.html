<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hacky Shortener</title>
</head>
<body>
    <h2>URL SHORTENER</h2>
    <input type="url" id="longUrl" placeholder="https://example.com" style="width:300px;">
    <button onclick="shorten()">Shorten</button>
    <p id="result"></p>

    <script>
        const GOOGLE_SCRIPT_URL = "https://google.com";

        async function shorten() {
            const longUrl = document.getElementById('longUrl').value.trim();
            if (!longUrl.startsWith('http')) return alert('Invalid URL');

            const slug = Math.random().toString(36).substring(2, 7);
            document.getElementById('result').innerText = "Saving to Google Sheet...";

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    redirect: "follow", 
                    method: "POST",
                    body: JSON.stringify({ slug: slug, url: longUrl })
                });

                // Fixed backtick interpolation ($ added) and missing trailing slash
                const shortUrl = `https://zescott.com{slug}`;
                document.getElementById('result').innerHTML = `Short link: <a href="${shortUrl}" target="_blank">${shortUrl}</a>`;
            } catch (err) {
                document.getElementById('result').innerText = "Error saving link.";
            }
        }
    </script>
</body>
</html>
