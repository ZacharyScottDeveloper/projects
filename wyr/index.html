<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A random Would You Rather game by Zescott.">
    <title>Would You Rather | Zescott</title>
</head>
<body>
    <header class="nav-bar">
        <a class="nav-item" href="https://zescott.com">Zescott</a>
        <span class="nav-item nav-current">Would You Rather</span>
    </header>

    <main class="game-shell">
        <p class="eyebrow">ZESCOTT / INTERACTIVE EXPERIENCE</p>
        <h1>Would You Rather?</h1>
        <p class="intro">A fun time-waster, pick from the two options below.</p>

        <section class="game-panel" aria-label="Would You Rather choices">
            <p class="prompt-label">MAKE YOUR CHOICE</p>
            <div class="choices">
                <button class="left" type="button">Option A</button>
                <span class="versus">OR</span>
                <button class="right" type="button">Option B</button>
            </div>
            <p class="hint">Select an answer to reveal another question</p>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
